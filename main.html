<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="chat-body">

    <div class="app-layout sidebar-open">
        <!-- 왼쪽 사이드바 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn">+ 새 대화</button>
            </div>

            <div class="chat-list">
                <div class="chat-item active" onclick="loadChat(0)">첫 번째 대화</div>
                <div class="chat-item" onclick="loadChat(1)">두 번째 대화</div>
                <div class="chat-item" onclick="loadChat(2)">세 번째 대화</div>
            </div>
        </div>

        <div class="chat-overlay" onclick="toggleSidebar()"></div>

        <!-- 오른쪽 채팅 화면 -->
        <div class="chat-app">
            <div class="chat-header">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                    
                <div class="user-info">
                    <div class="username">민채</div>
                    <div class="credit">Credit: 100</div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
            </div>

            <div class="chat-input-area">
                <input type="text" placeholder="메시지를 입력하세요">
                <button>전송</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
